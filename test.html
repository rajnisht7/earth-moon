<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Earth with moon</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e3a8a, #000);
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 0, 10);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambientLight = new THREE.AmbientLight(0x333333);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(0xffffff, 1.5); // Increased intensity
  pointLight.position.set(5, 5, 5);
  scene.add(pointLight);

  const earthGeometry = new THREE.SphereGeometry(2, 64, 64);
  const earthMaterial = new THREE.MeshPhongMaterial({
    color: 0xffffff, 
    specular: 0xbbbbbb, 
  });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  scene.add(earth);

  const textureLoader = new THREE.TextureLoader();
  textureLoader.load(
    'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', // Replace with a valid texture URL
    (texture) => {
      earthMaterial.map = texture;
      earthMaterial.needsUpdate = true;
    },
    undefined,
    (err) => {
      console.error('Error loading texture:', err);
      earthMaterial.color.setHex(0x4682b4); 
    }
  );

  const moonGeometry = new THREE.SphereGeometry(0.6, 32, 32);
  const moonMaterial = new THREE.MeshPhongMaterial({
    color: 0xffffff, 
    emissive: 0x000000,
    shininess: 20,
    specular: 0x555555
  });
  const moon = new THREE.Mesh(moonGeometry, moonMaterial);
  scene.add(moon);

  const starGeometry = new THREE.BufferGeometry();
  const starVertices = [];
  for (let i = 0; i < 1000; i++) {
    const x = (Math.random() - 0.5) * 200;
    const y = (Math.random() - 0.5) * 200;
    const z = (Math.random() - 0.5) * 200;
    starVertices.push(x, y, z);
  }
  starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starVertices, 3)
  );
  const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.1
  });
  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);


  let angle = 0;
  function animate() {
    requestAnimationFrame(animate);

    angle += 0.01;
    moon.position.x = 5 * Math.cos(angle);
    moon.position.z = 5 * Math.sin(angle);

    earth.rotation.y += 0.002;
    moon.rotation.y += 0.005;
    stars.rotation.y += 0.0005;

    renderer.render(scene, camera);
  }

  animate();


  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
